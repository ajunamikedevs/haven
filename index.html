<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Haven has moved</title>
<link rel="canonical" href="https://havenweek.app/">
<script>
// Haven moved from this page to its own app. Links from the old Haven keep everything after the "#",
// which never reaches any server, so carry it across: #s=… snapshots open read-only, #week etc. open
// the matching screen. A week saved in this browser by the old Haven is handed over as #w=… so the
// new app can offer to import it after sign-in.
(function () {
  var app = 'https://havenweek.app/';
  var hash = location.hash;
  if (!hash) {
    try {
      var saved = localStorage.getItem('haven.v1');
      if (saved && Array.isArray(JSON.parse(saved).members)) {
        var bytes = new TextEncoder().encode(saved), bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        hash = '#w=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
    } catch (e) { /* nothing saved, or storage blocked: just go to the app */ }
  }
  location.replace(app + hash);
})();
</script>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #FBF9F7; color: #2B2724; }
a { color: #A35F42; }
</style>
</head>
<body>
<p>Haven has moved to <a href="https://havenweek.app/">havenweek.app</a>.</p>
</body>
</html>
